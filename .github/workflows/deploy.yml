name: Deploy to monday

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Install the mapps CLI
        run: npm install -g @mondaycom/apps-cli

      - name: Log in to mapps
        run: mapps init --token "${{ secrets.MONDAY_TOKEN }}"

      - name: Push dist to the live version
        run: >
          mapps code:push --client-side --directoryPath dist
          --appId "${{ vars.MONDAY_APP_ID }}"
          --appVersionId "${{ vars.MONDAY_APP_VERSION_ID }}"
          --force
